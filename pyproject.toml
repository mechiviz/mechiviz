# ==== Project info

[project]
name = "mechiviz"
version = "0.0.1"
description = "Interactive mechanistic interpretability"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Caitlin Lewis", email = "caitlin.lewis@duke.edu" },
]
keywords = [
    "mechanistic interpretability",
    "machine learning",
    "LLM",
    "interactive visualization"
]

dependencies = [
    "numpy",
    "wgpu==0.32.0",  # matches the vendored wgpu-native build (v29.0.1.1)
    "tinygrad",
    "fastplotlib[imgui]",
    "glfw",
    "torch",
    "cuda-python",
]

[project.optional-dependencies]
lint = ["ruff"]
tests = ["pytest"]
notebook = ["jupyterlab"]
examples = ["torchvision", "tqdm"]
dev = ["mechiviz[lint, tests, notebook]"]

[project.urls]
Homepage = "https://github.com/clewis7/mechiviz"

# ===== Building

# hatchling instead of flit: needed to bundle the .so and set a platform wheel tag
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mechiviz"]

[tool.hatch.build.targets.wheel.hooks.custom]  # runs hatch_build.py

# ===== Tooling

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["D", "F", "E", "W", "N", "B", "RUF", "TC"]
ignore = [
    "E501",   # Line too long
    "E731",   # Do not assign a `lambda` expression, use a `def`
    "B019",   # Use of `functools.lru_cache` or `functools.cache` on methods can lead to memory leaks
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`"
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"